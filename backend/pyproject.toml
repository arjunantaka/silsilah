[tool.poetry]
name = "keluarga-backend"
version = "1.0.0"
description = "Silsilah Keluarga Backend API"
authors = ["Keluarga Dev <dev@keluarga.app>"]
packages = [{include = "keluarga_backend"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlmodel = "^0.0.14"
python-multipart = "^0.0.6"
python-dateutil = "^2.8.2"
pillow = "^10.0.1"
pandas = "^2.1.3"
pydantic = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
ruff = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]