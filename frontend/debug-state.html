<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="output"></div>
    <script>
        // Clear localStorage and check sample data loading
        localStorage.clear();
        
        const sampleData = {
            "families": [{"id": "test-family", "nama": "Test Family", "root_id": "person1"}],
            "persons": [{"id": "person1", "keluarga_id": "test-family", "nama_lengkap": "Test Person"}],
            "layouts": {"test-family": {"person1": {"x": 100, "y": 100}}}
        };
        
        localStorage.setItem('keluarga-app-state', JSON.stringify(sampleData));
        
        document.getElementById('output').innerHTML = `
            <p>localStorage data set successfully</p>
            <p>Test complete - <a href="/">Go to main app</a></p>
        `;
    </script>
</body>
</html>
